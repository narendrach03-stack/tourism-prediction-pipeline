name: Tourism MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  register_dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Run Data Registration
        run: python tourism_project/model_building/data_register.py

  data_prep:
    needs: register_dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Run Preprocessing
        run: python tourism_project/model_building/prep.py

      - name: Upload Processed Datasets as Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: processed-data
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model_training:
    needs: data_prep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Download Processed Datasets
        uses: actions/download-artifact@v3
        with:
          name: processed-data

      - name: Start MLflow Server
        run: |
          mlflow server --host 127.0.0.1 --port 5000 &
          sleep 5

      - name: Train & Log Model
        run: python tourism_project/model_building/train.py

      - name: Commit Trained Model back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model_v1.joblib
          git commit -m "Automated model training update [skip ci]" || echo "No changes to commit"
          git push
