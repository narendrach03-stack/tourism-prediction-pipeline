name: Tourism MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Start MLflow Server
        run: |
          mlflow server --host 127.0.0.1 --port 5000 &
          sleep 5

      - name: Step 1 - Data Registration
        run: python tourism_project/model_building/data_register.py

      - name: Step 2 - Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Step 3 - Model Training
        run: python tourism_project/model_building/train.py

      - name: Commit Trained Model back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model_v1.joblib
          git commit -m "Automated model training update [skip ci]" || echo "No changes to commit"
          git push
